<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Dark Pastel - Selección de Proxies</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#181619] text-[#e2d9dc] h-screen flex items-center justify-center font-sans select-none p-4 overflow-hidden">

    <main class="w-full max-w-5xl h-[92vh] relative flex flex-col">
        <div class="bg-[#201d22] border border-[#2d282e] rounded-3xl p-7 shadow-2xl shadow-black/50 grid grid-cols-1 md:grid-cols-2 gap-6 h-full overflow-hidden">
            
            <!-- COLUMNA IZQUIERDA: Panel de Control -->
            <div class="space-y-3 flex flex-col justify-between overflow-y-auto pr-1">
                <div>
                    <!-- Cabecera -->
                    <div class="border-b border-[#2d282e] pb-3 flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-pink-400 shadow-[0_0_8px_rgba(244,114,182,0.6)]"></span>
                            <h1 class="text-xs font-bold text-pink-300 tracking-wider uppercase">Panel de Control Go</h1>
                        </div>
                        <button onclick="abrirModalProxies()" class="text-xs bg-[#2a252c] hover:bg-[#342e36] text-pink-300 font-medium px-3.5 py-1.5 rounded-xl transition flex items-center gap-1.5 border border-[#3a323d]">
                            ⚙️ Editar Listas de Proxies
                        </button>
                    </div>

                    <!-- Contadores -->
                    <div class="grid grid-cols-5 gap-1 bg-[#141215] border border-[#2d282e] p-2.5 rounded-2xl text-center mb-3">
                        <div>
                            <div class="text-[8px] text-[#a3979b] uppercase font-semibold">SOCKS5</div>
                            <div id="count-socks5" class="text-xs font-bold text-pink-300">0</div>
                        </div>
                        <div class="border-x border-[#2d282e]">
                            <div class="text-[8px] text-[#a3979b] uppercase font-semibold">SOCKS4</div>
                            <div id="count-socks4" class="text-xs font-bold text-pink-300">0</div>
                        </div>
                        <div class="border-r border-[#2d282e]">
                            <div class="text-[8px] text-[#a3979b] uppercase font-semibold">HTTP</div>
                            <div id="count-http" class="text-xs font-bold text-pink-300">0</div>
                        </div>
                        <div class="border-r border-[#2d282e]">
                            <div class="text-[8px] text-[#a3979b] uppercase font-semibold">Listos</div>
                            <div id="count-total" class="text-xs font-bold text-emerald-400">0</div>
                        </div>
                        <div>
                            <div class="text-[8px] text-pink-400 uppercase font-bold">Enviados</div>
                            <div id="count-requests" class="text-xs font-bold text-pink-400">0</div>
                        </div>
                    </div>

                    <!-- Formulario Principal -->
                    <div class="space-y-2.5">
                        <div>
                            <label class="block text-xs font-semibold text-[#a3979b] mb-1">IP, Dominio o URL de Destino</label>
                            <input type="text" placeholder="ej. miweb.com o 127.0.0.1" id="IP" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2 text-xs text-[#f4ecf0] placeholder-[#6b6166] focus:outline-none focus:border-pink-400 transition shadow-inner">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-[#a3979b] mb-1">Puerto</label>
                                <input type="text" placeholder="80" id="puerto" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2 text-xs text-[#f4ecf0] placeholder-[#6b6166] focus:outline-none focus:border-pink-400 transition shadow-inner">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-[#a3979b] mb-1">Protocolo</label>
                                <select id="protocolo" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner">
                                    <option value="HTTP_Flood">HTTP Flood</option>
                                    <option value="TCP_SYN_Flood">TCP Flood</option>
                                    <option value="UDP_Flood">UDP Flood</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-[#a3979b] mb-1">Tam. Paquete (Bytes)</label>
                                <input type="number" value="512" id="tamano" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-[#a3979b] mb-1">Delay (ms)</label>
                                <input type="number" value="0" id="delay" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner" placeholder="0 = sin pausa">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-[#a3979b] mb-1">Modo de Operación</label>
                            <select id="modoOrigen" onchange="toggleSeleccionProxies()" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner">
                                <option value="directo">Directo (Sin Proxies)</option>
                                <option value="proxies">Usar Proxies Seleccionados</option>
                            </select>
                        </div>

                        <!-- Selector de qué tipo de proxies activar -->
                        <div id="panelSelectorProxies" class="hidden bg-[#141215] border border-[#2d282e] p-3 rounded-2xl space-y-2">
                            <span class="block text-xs font-semibold text-pink-300">Seleccionar tipos de proxies a usar:</span>
                            <div class="grid grid-cols-3 gap-2">
                                <label class="flex items-center gap-1.5 text-xs cursor-pointer">
                                    <input type="checkbox" id="checkSocks5" checked class="accent-pink-400"> SOCKS5
                                </label>
                                <label class="flex items-center gap-1.5 text-xs cursor-pointer">
                                    <input type="checkbox" id="checkSocks4" checked class="accent-pink-400"> SOCKS4 (DNS)
                                </label>
                                <label class="flex items-center gap-1.5 text-xs cursor-pointer">
                                    <input type="checkbox" id="checkHttp" checked class="accent-pink-400"> HTTP
                                </label>
                            </div>
                        </div>

                        <!-- Control de Volumen / Límite de Proxies Simultáneos -->
                        <div class="bg-[#141215] border border-[#2d282e] p-3 rounded-2xl space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-semibold text-pink-300">Modo Discreto (Limitar Proxies)</span>
                                <input type="checkbox" id="activarLimite" onchange="toggleControlProxies()" class="w-4 h-4 accent-pink-400 cursor-pointer">
                            </div>
                            <div id="contenedorSlider" class="hidden space-y-1 pt-1">
                                <div class="flex justify-between text-[10px] text-[#a3979b]">
                                    <span>Máximo por tipo activo:</span>
                                    <span id="valorMaxProxies" class="text-pink-300 font-bold">10</span>
                                </div>
                                <input type="range" id="maxProxiesRange" min="1" max="100" value="10" oninput="document.getElementById('valorMaxProxies').innerText = this.value" class="w-full accent-pink-400 bg-[#2d282e] h-1.5 rounded-lg cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="flex gap-3 pt-2">
                    <button onclick="atacar()" class="flex-1 bg-pink-400 hover:bg-pink-500 text-stone-950 font-bold py-3 rounded-xl text-xs tracking-wide transition shadow-md shadow-pink-400/10">
                        Iniciar Acción
                    </button>
                    <button onclick="pararAtaque()" class="flex-1 bg-[#2a252c] hover:bg-[#342e36] text-[#b8aab0] hover:text-white font-semibold py-3 rounded-xl text-xs tracking-wide transition border border-[#3a323d]">
                        Detener Todo
                    </button>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Consola de Logs -->
            <div class="flex flex-col h-full min-h-0">
                <div class="flex justify-between items-center mb-1.5 flex-none">
                    <label class="text-xs font-semibold text-[#a3979b]">Registro en Vivo por Proxy</label>
                    <button onclick="limpiarLogs()" class="text-[10px] text-pink-400 hover:underline">Limpiar Consola</button>
                </div>
                <div id="terminal-logs" class="w-full bg-[#141215] border border-[#2d282e] rounded-xl p-3.5 text-[11px] text-pink-300 font-mono flex-1 overflow-y-auto shadow-inner break-all whitespace-pre-wrap">
                    <div>> Sistema preparado. Verás el impacto de cada proxy aquí...</div>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL CON 3 RECUADROS INDEPENDIENTES PARA CADA PROXY -->
    <div id="modalProxies" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-[#201d22] border border-[#2d282e] rounded-3xl p-6 w-full max-w-4xl space-y-4 shadow-2xl h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-[#2d282e] pb-3 flex-none">
                <h2 class="text-xs font-bold text-pink-300 uppercase tracking-wider">Gestión Independiente de Proxies</h2>
                <button onclick="cerrarModalProxies()" class="text-[#a3979b] hover:text-white text-sm font-bold">✕</button>
            </div>

            <div class="grid grid-cols-3 gap-4 flex-1 min-h-0">
                <!-- Recuadro SOCKS5 -->
                <div class="flex flex-col h-full">
                    <label class="block text-xs font-semibold text-pink-300 mb-1">SOCKS5 (proxies.txt)</label>
                    <textarea id="textareaSocks5" class="w-full bg-[#141215] border border-[#2d282e] rounded-xl p-3 text-xs text-pink-200 font-mono flex-1 focus:outline-none focus:border-pink-400 transition shadow-inner"></textarea>
                </div>
                <!-- Recuadro SOCKS4 -->
                <div class="flex flex-col h-full">
                    <label class="block text-xs font-semibold text-pink-300 mb-1">SOCKS4 (Resuelve IP automática)</label>
                    <textarea id="textareaSocks4" class="w-full bg-[#141215] border border-[#2d282e] rounded-xl p-3 text-xs text-pink-200 font-mono flex-1 focus:outline-none focus:border-pink-400 transition shadow-inner"></textarea>
                </div>
                <!-- Recuadro HTTP -->
                <div class="flex flex-col h-full">
                    <label class="block text-xs font-semibold text-pink-300 mb-1">HTTP / HTTPS (proxies_http.txt)</label>
                    <textarea id="textareaHttp" class="w-full bg-[#141215] border border-[#2d282e] rounded-xl p-3 text-xs text-pink-200 font-mono flex-1 focus:outline-none focus:border-pink-400 transition shadow-inner"></textarea>
                </div>
            </div>

            <button onclick="guardarTodosProxies()" class="w-full bg-pink-400 hover:bg-pink-500 text-stone-950 font-bold py-3 rounded-xl text-xs tracking-wide transition shadow-md shadow-pink-400/10 flex-none">
                Guardar Todos los Cambios
            </button>
        </div>
    </div>

    <!-- Scripts de Interfaz y Websockets -->
    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        let ws;
        let reqCount = 0;
        let logQueue = [];
        const MAX_LOGS = 100;

        function conectarWebSocket() {
            ws = new WebSocket(wsProtocol + window.location.host + '/ws');
            ws.onmessage = function(event) {
                logQueue.push(event.data);
                if (event.data.includes("PROXY]") || event.data.includes("DIRECTO")) {
                    reqCount++;
                }
            };
            ws.onclose = function() {
                setTimeout(conectarWebSocket, 2000);
            };
        }
        conectarWebSocket();

        function procesarColaLogs() {
            if (logQueue.length > 0) {
                const box = document.getElementById("terminal-logs");
                const fragment = document.createDocumentFragment();
                const lote = logQueue.splice(0, logQueue.length);

                lote.forEach(msg => {
                    const div = document.createElement("div");
                    div.textContent = `> ${msg}`;
                    fragment.appendChild(div);
                });

                box.appendChild(fragment);
                while (box.children.length > MAX_LOGS) {
                    box.removeChild(box.firstChild);
                }
                box.scrollTop = box.scrollHeight;
                document.getElementById("count-requests").innerText = reqCount;
            }
            requestAnimationFrame(procesarColaLogs);
        }
        requestAnimationFrame(procesarColaLogs);

        function limpiarLogs() {
            const box = document.getElementById("terminal-logs");
            box.innerHTML = '<div>> Consola limpiada.</div>';
            logQueue = [];
        }

        function actualizarContadores() {
            fetch('/api/proxies/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('count-socks5').innerText = data.socks5;
                    document.getElementById('count-socks4').innerText = data.socks4;
                    document.getElementById('count-http').innerText = data.http;
                    document.getElementById('count-total').innerText = data.total;
                })
                .catch(() => {});
        }
        actualizarContadores();

        function toggleSeleccionProxies() {
            const modo = document.getElementById('modoOrigen').value;
            const panel = document.getElementById('panelSelectorProxies');
            if (modo === 'proxies') {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        function toggleControlProxies() {
            const activado = document.getElementById('activarLimite').checked;
            const contenedor = document.getElementById('contenedorSlider');
            if (activado) {
                contenedor.classList.remove('hidden');
            } else {
                contenedor.classList.add('hidden');
            }
        }

        function abrirModalProxies() {
            document.getElementById('modalProxies').classList.remove('hidden');
            document.getElementById('modalProxies').classList.add('flex');
            
            // Cargar los tres archivos en paralelo en sus respectivos textareas
            fetch('/api/proxies?tipo=socks5').then(r => r.text()).then(d => document.getElementById('textareaSocks5').value = d);
            fetch('/api/proxies?tipo=socks4').then(r => r.text()).then(d => document.getElementById('textareaSocks4').value = d);
            fetch('/api/proxies?tipo=http').then(r => r.text()).then(d => document.getElementById('textareaHttp').value = d);
        }

        function cerrarModalProxies() {
            document.getElementById('modalProxies').classList.remove('flex');
            document.getElementById('modalProxies').classList.add('hidden');
            actualizarContadores();
        }

        async function guardarTodosProxies() {
            const s5 = document.getElementById('textareaSocks5').value;
            const s4 = document.getElementById('textareaSocks4').value;
            const ht = document.getElementById('textareaHttp').value;

            await fetch('/api/proxies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo: 'socks5', contenido: s5 }) });
            await fetch('/api/proxies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo: 'socks4', contenido: s4 }) });
            await fetch('/api/proxies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo: 'http', contenido: ht }) });

            alert('¡Todas las listas de proxies se han guardado correctamente!');
            cerrarModalProxies();
        }

        function atacar() {
            reqCount = 0;
            document.getElementById("count-requests").innerText = "0";
            const data = {
                ip: document.getElementById("IP").value,
                puerto: document.getElementById("puerto").value,
                tamano: parseInt(document.getElementById("tamano").value) || 512,
                delay: parseInt(document.getElementById("delay").value) || 0,
                protocolo: document.getElementById("protocolo").value,
                modo: document.getElementById("modoOrigen").value,
                usarSocks5: document.getElementById("checkSocks5").checked,
                usarSocks4: document.getElementById("checkSocks4").checked,
                usarHttp: document.getElementById("checkHttp").checked,
                activarLimite: document.getElementById("activarLimite").checked,
                maxProxies: parseInt(document.getElementById("maxProxiesRange").value) || 10
            };
            fetch('/api/atacar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        }

        function pararAtaque() {
            fetch('/api/parar', { method: 'POST' }).then(() => {
                console.log("Señal de parada enviada.");
            });
        }
    </script>
</body>
</html>
