<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Dark Pastel - Control de Flujo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#181619] text-[#e2d9dc] min-h-screen flex items-center justify-center font-sans select-none p-4">

    <main class="w-full max-w-lg relative">
        <div class="bg-[#201d22] border border-[#2d282e] rounded-3xl p-7 shadow-2xl shadow-black/50 space-y-6">
            
            <!-- Cabecera -->
            <div class="border-b border-[#2d282e] pb-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-pink-400 shadow-[0_0_8px_rgba(244,114,182,0.6)]"></span>
                    <h1 class="text-xs font-bold text-pink-300 tracking-wider uppercase">Panel de Control Go</h1>
                </div>
                <button onclick="abrirModalProxies()" class="text-xs bg-[#2a252c] hover:bg-[#342e36] text-pink-300 font-medium px-3.5 py-1.5 rounded-xl transition flex items-center gap-1.5 border border-[#3a323d]">
                    ⚙️ Configurar Proxies
                </button>
            </div>

            <!-- Contador de Proxies en Vivo -->
            <div class="grid grid-cols-3 gap-2 bg-[#141215] border border-[#2d282e] p-3 rounded-2xl text-center">
                <div>
                    <div class="text-[10px] text-[#a3979b] uppercase font-semibold">SOCKS5</div>
                    <div id="count-socks" class="text-xs font-bold text-pink-300">0</div>
                </div>
                <div class="border-x border-[#2d282e]">
                    <div class="text-[10px] text-[#a3979b] uppercase font-semibold">HTTP</div>
                    <div id="count-http" class="text-xs font-bold text-pink-300">0</div>
                </div>
                <div>
                    <div class="text-[10px] text-[#a3979b] uppercase font-semibold">Total Listos</div>
                    <div id="count-total" class="text-xs font-bold text-emerald-400">0</div>
                </div>
            </div>

            <!-- Formulario Principal -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">IP o URL de Destino</label>
                    <input type="text" placeholder="ej. 127.0.0.1 o dominio.com" id="IP" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2.5 text-xs text-[#f4ecf0] placeholder-[#6b6166] focus:outline-none focus:border-pink-400 transition shadow-inner">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Puerto</label>
                        <input type="text" placeholder="80" id="puerto" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2.5 text-xs text-[#f4ecf0] placeholder-[#6b6166] focus:outline-none focus:border-pink-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Protocolo</label>
                        <select id="protocolo" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2.5 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner">
                            <option value="HTTP_Flood">HTTP Flood</option>
                            <option value="TCP_SYN_Flood">TCP Flood</option>
                            <option value="UDP_Flood">UDP Flood</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Tam. Paquete (Bytes)</label>
                        <input type="number" value="512" id="tamano" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2.5 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Delay (ms)</label>
                        <input type="number" value="0" id="delay" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2.5 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner" placeholder="0 = sin pausa">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Modo de Operación</label>
                    <select id="modoOrigen" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2.5 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition shadow-inner">
                        <option value="directo">Directo (Sin Proxies)</option>
                        <option value="proxies">Usar Lista Masiva Combinada (SOCKS5 + HTTP)</option>
                    </select>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex gap-3 pt-2">
                <button onclick="atacar()" class="flex-1 bg-pink-400 hover:bg-pink-500 text-stone-950 font-bold py-3 rounded-xl text-xs tracking-wide transition shadow-md shadow-pink-400/10">
                    Iniciar Acción
                </button>
                <button onclick="pararAtaque()" class="flex-1 bg-[#2a252c] hover:bg-[#342e36] text-[#b8aab0] hover:text-white font-semibold py-3 rounded-xl text-xs tracking-wide transition border border-[#3a323d]">
                    Detener Todo
                </button>
            </div>

            <!-- Consola de Logs Estética -->
            <div class="pt-2">
                <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Registro en Vivo</label>
                <div id="terminal-logs" class="w-full bg-[#141215] border border-[#2d282e] rounded-xl p-3.5 text-[11px] text-pink-300 font-mono h-32 overflow-y-auto shadow-inner">
                    <div>> Sistema preparado con control de tamaño y delay global...</div>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL CONFIGURACIÓN DE PROXIES -->
    <div id="modalProxies" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-[#201d22] border border-[#2d282e] rounded-3xl p-7 w-full max-w-lg space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-[#2d282e] pb-3">
                <h2 class="text-xs font-bold text-pink-300 uppercase tracking-wider">Gestión de Proxies</h2>
                <button onclick="cerrarModalProxies()" class="text-[#a3979b] hover:text-white text-sm font-bold">✕</button>
            </div>

            <div>
                <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Seleccionar Archivo:</label>
                <select id="tipoProxyModal" onchange="cargarProxiesModal()" class="w-full bg-[#181619] border border-[#2d282e] rounded-xl px-3.5 py-2.5 text-xs text-[#f4ecf0] focus:outline-none focus:border-pink-400 transition mb-3 shadow-inner">
                    <option value="socks5">SOCKS5 (proxies.txt)</option>
                    <option value="http">HTTP/HTTPS (proxies_http.txt)</option>
                </select>

                <label class="block text-xs font-semibold text-[#a3979b] mb-1.5">Lista de Proxies (IP:PUERTO)</label>
                <textarea id="textareaProxies" rows="7" class="w-full bg-[#141215] border border-[#2d282e] rounded-xl p-3.5 text-xs text-pink-200 font-mono focus:outline-none focus:border-pink-400 transition shadow-inner"></textarea>
            </div>

            <button onclick="guardarProxies()" class="w-full bg-pink-400 hover:bg-pink-500 text-stone-950 font-bold py-3 rounded-xl text-xs tracking-wide transition shadow-md shadow-pink-400/10">
                Guardar Cambios
            </button>
        </div>
    </div>

    <!-- WebSockets & Estadísticas -->
    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(wsProtocol + window.location.host + '/ws');

        ws.onmessage = function(event) {
            const box = document.getElementById("terminal-logs");
            box.innerHTML += `<div>> ${event.data}</div>`;
            box.scrollTop = box.scrollHeight;
        };

        function actualizarContadores() {
            fetch('/api/proxies/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('count-socks').innerText = data.socks5;
                    document.getElementById('count-http').innerText = data.http;
                    document.getElementById('count-total').innerText = data.total;
                });
        }
        actualizarContadores();

        function abrirModalProxies() {
            document.getElementById('modalProxies').classList.remove('hidden');
            document.getElementById('modalProxies').classList.add('flex');
            cargarProxiesModal();
        }

        function cerrarModalProxies() {
            document.getElementById('modalProxies').classList.remove('flex');
            document.getElementById('modalProxies').classList.add('hidden');
            actualizarContadores();
        }

        function cargarProxiesModal() {
            const tipo = document.getElementById('tipoProxyModal').value;
            fetch(`/api/proxies?tipo=${tipo}`)
                .then(res => res.text())
                .then(data => { document.getElementById('textareaProxies').value = data; });
        }

        function guardarProxies() {
            const tipo = document.getElementById('tipoProxyModal').value;
            const contenido = document.getElementById('textareaProxies').value;

            fetch('/api/proxies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tipo, contenido })
            }).then(() => {
                alert('¡Lista guardada con éxito!');
                cerrarModalProxies();
            });
        }

        function atacar() {
            const data = {
                ip: document.getElementById("IP").value,
                puerto: document.getElementById("puerto").value,
                tamano: parseInt(document.getElementById("tamano").value) || 512,
                delay: parseInt(document.getElementById("delay").value) || 0,
                protocolo: document.getElementById("protocolo").value,
                modo: document.getElementById("modoOrigen").value
            };
            fetch('/api/atacar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        }

        function pararAtaque() {
            fetch('/api/parar', { method: 'POST' });
        }
    </script>
</body>
</html>
